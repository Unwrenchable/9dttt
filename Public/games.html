    <style>
        body { background: #0a0e27; color: #e0e0e0; font-family: Arial, sans-serif; }
        .downloads-container { max-width: 1100px; margin: 40px auto; padding: 24px; background: #181c3a; border-radius: 16px; box-shadow: 0 4px 32px #0008; }
        h1 { text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #a0a8c0; margin-bottom: 28px; }
        .game-list { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
        .game-card { background: #232857; border-radius: 12px; padding: 18px 16px; width: 160px; text-align: center; box-shadow: 0 2px 12px #0006; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-6px) scale(1.04); }
        .game-silhouette { width: 90px; height: 90px; background: #11131f; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #3a406e; }
        .game-title { font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
        .download-link { display: inline-block; margin-top: 6px; color: #4a90e2; text-decoration: none; font-weight: bold; font-size: 0.85rem; }
        .download-link:hover { text-decoration: underline; }
        .back-link { display: block; text-align: center; margin-top: 32px; color: #a0a8c0; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { color: #4a90e2; }
        .game-card.locked { opacity: 0.6; }
        .game-card.highlight { outline: 3px solid #FFD700; opacity: 1; }
        .locked-notice { text-align: center; color: #FFD700; font-weight: bold; margin: 0 0 18px; }
        .unlock-btn { margin-top: 6px; background: #FFD700; color: #111; border: 0; border-radius: 6px; padding: 6px 10px; font-weight: bold; cursor: pointer; }
    </style>
