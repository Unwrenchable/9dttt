name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine unit tests
        run: npm run test:ai

      - name: Syntax check Public/ JavaScript
        run: find Public -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Verify static entry point
        run: test -f Public/index.html
